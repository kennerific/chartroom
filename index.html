<header class="masthead">
  <div class="masthead-in">
    <span class="brand">Chartroom</span>
    <div class="tally">
      <span class="track"><i id="tally-bar" style="width:0%"></i></span>
      <span id="tally-text" class="mono">counting</span>
    </div>
    <div class="tabs" role="tablist" aria-label="Mode">
      <button id="tab-learn" role="tab" aria-selected="true"><svg class="ic" aria-hidden="true"><use href="#i-book-open"></use></svg><span>Learn</span></button>
      <button id="tab-exam" role="tab" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#i-graduation-cap"></use></svg><span>Exam</span></button>
    </div>
    <button class="iconbtn" id="theme" title="Switch light and dark" aria-label="Switch light and dark"><svg class="ic" aria-hidden="true"><use href="#i-moon" id="theme-glyph"></use></svg></button>
  </div>
</header>

<div id="boot" class="boot">Loading chart data.</div>

<div class="shell" id="shell" data-mode="learn" hidden>

  <aside class="rail" aria-label="Boards">
    <div class="rail-head"><span class="eyebrow">Boards</span></div>
    <nav class="rail-list" id="boards"></nav>
    <p class="rail-note">Study a board to unlock its drill.</p>
  </aside>

  <main class="workspace">
    <section id="view-learn" class="view">
      <div class="wshead">
        <div class="wstitle">
          <h2 id="board-name"></h2>
          <p class="wsnote" id="stage-note"></p>
        </div>
        <div class="tabs" role="tablist" aria-label="Stage">
          <button id="stage-study" role="tab" aria-selected="true"><svg class="ic" aria-hidden="true"><use href="#i-book-open"></use></svg><span>Study</span></button>
          <button id="stage-drill" role="tab" aria-selected="false"><svg class="ic" aria-hidden="true"><use href="#i-crosshair"></use></svg><span>Drill</span></button>
        </div>
      </div>
      <div class="work">
        <div class="stage"><canvas id="map-learn" class="pick"></canvas><div class="tip" id="tip-learn"></div></div>
        <aside class="panel" id="panel-learn"></aside>
      </div>
    </section>

    <section id="view-exam" class="view" hidden>
      <div class="wshead">
        <div class="wstitle">
          <h2>Recall test</h2>
          <p class="wsnote" id="exam-readiness"></p>
        </div>
      </div>
      <div class="work" id="exam-work">
        <div class="stage"><canvas id="map-exam" class="pick"></canvas><div class="tip" id="tip-exam"></div></div>
        <aside class="panel" id="panel-exam"></aside>
      </div>
      <div class="results" id="exam-results" hidden></div>
    </section>
  </main>
</div>
